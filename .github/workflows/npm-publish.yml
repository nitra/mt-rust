name: npm-publish

# Окремий workflow — ім'я файлу критичне: OIDC Trusted Publisher на npmjs.com
# (@7n/mt-darwin-arm64, @7n/mt-linux-x64, @7n/mt-napi) прив'язаний саме до
# ".github/workflows/npm-publish.yml", не до release-mt.yml. Тому build-napi/
# publish-mt-napi винесені сюди з release-mt.yml (docs/specs/2026-07-27-mt-napi-binding.md).

on:
  push:
    tags:
      - 'mt-v*'
  workflow_dispatch: {}

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions: {} # deny-all за замовчуванням; кожен job оголошує потрібне

jobs:
  # ── Збірка napi-аддона `mt` (crates/mt-napi → .node) ──────────────────────────
  build-napi:
    permissions:
      contents: read # лише checkout; артефакти йдуть через runtime-токен
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-14 # native Apple Silicon
            target: aarch64-apple-darwin
            napi_suffix: darwin-arm64
            cdylib: libmt_napi.dylib
            zig: false
          - os: ubuntu-latest # static musl через cargo-zigbuild
            target: x86_64-unknown-linux-musl
            napi_suffix: linux-x64-musl
            cdylib: libmt_napi.so
            zig: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false # build-only, токен не потрібен

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          lookup-only: true # release з тегу: не restore/save shared cache (zizmor cache-poisoning)

      - name: Install cargo-zigbuild (Linux musl)
        if: ${{ matrix.zig }}
        run: |
          pip install ziglang
          cargo install --locked cargo-zigbuild

      - name: Build mt-napi (zigbuild)
        if: ${{ matrix.zig }}
        # musl-таргет за замовчуванням fully-static (crt-static) — не підтримує cdylib
        # ("cannot produce cdylib... does not support these crate types"). napi-аддон
        # (на відміну від CLI-бінарника в release-mt.yml, якому crt-static якраз потрібен) —
        # вимикаємо crt-static лише для цього кроку, як і документує сам napi-rs для musl.
        env:
          RUSTFLAGS: -C target-feature=-crt-static
        run: cargo zigbuild --release --target ${{ matrix.target }} -p mt-napi

      - name: Build mt-napi (native)
        if: ${{ !matrix.zig }}
        run: cargo build --release --target ${{ matrix.target }} -p mt-napi

      - name: Stage .node addon
        # napi-rs cdylib є валідним Node native addon незалежно від розширення файлу —
        # перейменування без окремого napi-CLI кроку.
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.cdylib }}" "dist/mt.${{ matrix.napi_suffix }}.node"

      - uses: actions/upload-artifact@v4
        with:
          name: mt-napi-${{ matrix.napi_suffix }}
          path: dist/mt.${{ matrix.napi_suffix }}.node
          if-no-files-found: error

  # ── Публікація napi-платформних пакетів + @7n/mt-napi (npm OIDC/provenance) ───
  publish-mt-napi:
    needs: build-napi
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC trusted publishing на npmjs (без NPM_TOKEN)
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # OIDC trusted publishing (JS-DevTools/npm-publish README): потребує npm >=11.5.1.
      # Node 24 з setup-node не гарантовано несе саме цю версію — явно піднімаємо,
      # інакше публікація падає "need auth" навіть при коректному Trusted Publisher
      # на боці npmjs.com (живий тест: mt-v0.1.5/0.1.6 — саме ця причина).
      - name: Upgrade npm for trusted publishing support
        run: npm install -g npm@^11.5

      - name: Download napi addons
        uses: actions/download-artifact@v4
        with:
          path: dist # → dist/mt-napi-<suffix>/mt.<suffix>.node

      - name: Stage addons into platform packages
        run: |
          cp dist/mt-napi-darwin-arm64/mt.darwin-arm64.node packages/mt-darwin-arm64/
          cp dist/mt-napi-linux-x64-musl/mt.linux-x64-musl.node packages/mt-linux-x64/

      - name: Sync main package version to workspace version
        run: |
          VERSION="${GITHUB_REF_NAME#mt-v}"
          echo "Publishing @7n/mt-napi $VERSION"
          V="$VERSION" node -e "const f='npm/mt-napi/package.json';const p=require('./'+f);p.version=process.env.V;require('fs').writeFileSync(f, JSON.stringify(p,null,2)+'\n')"

      # `@7n/mt-darwin-arm64`/`@7n/mt-linux-x64` — ІМЕНА, успадковані зі старого репо
      # nitra/mt (там вони бандлили mt-scanner-бінарник + napi-аддон, останній реліз
      # 0.28.0). Тут вони несуть лише napi-аддон — інший корисний вантаж, тож НЕ
      # lockstep із workspace-версією mt-core: власний monotonic-лічильник поверх
      # уже опублікованої версії. Перший napi-only реліз — мінорний bump (0.29.0),
      # щоб позначити змістовий розрив із форматом 0.28.0; далі — patch++.
      - name: Compute platform package version (independent of workspace version)
        id: platform_ver
        run: |
          latest=$(npm view @7n/mt-darwin-arm64 version 2>/dev/null || echo "0.28.0")
          IFS='.' read -r major minor patch <<< "$latest"
          if [ "$major.$minor" = "0.28" ]; then
            next="0.29.0"
          else
            next="$major.$minor.$((patch + 1))"
          fi
          echo "platform version: $latest → $next"
          echo "version=$next" >> "$GITHUB_OUTPUT"

      - name: Sync platform package versions
        env:
          PLATFORM_VERSION: ${{ steps.platform_ver.outputs.version }}
        run: |
          for pkg in packages/mt-darwin-arm64 packages/mt-linux-x64; do
            V="$PLATFORM_VERSION" node -e "const f=process.argv[1]+'/package.json';const p=require('./'+f);p.version=process.env.V;require('fs').writeFileSync(f, JSON.stringify(p,null,2)+'\n')" "$pkg"
          done
          node -e "const f='npm/mt-napi/package.json';const p=require('./'+f);for(const k of Object.keys(p.optionalDependencies||{}))p.optionalDependencies[k]=process.env.PLATFORM_VERSION;require('fs').writeFileSync(f, JSON.stringify(p,null,2)+'\n')"

      # Платформні пакети — ПЕРЕД головним (його optionalDependencies вже вказують на ці версії).
      - name: Publish @7n/mt-darwin-arm64
        uses: JS-DevTools/npm-publish@v4.1.5
        with:
          package: packages/mt-darwin-arm64/package.json

      - name: Publish @7n/mt-linux-x64
        uses: JS-DevTools/npm-publish@v4.1.5
        with:
          package: packages/mt-linux-x64/package.json

      - name: Publish @7n/mt-napi
        uses: JS-DevTools/npm-publish@v4.1.5
        with:
          package: npm/mt-napi/package.json
