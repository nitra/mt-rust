[package]
name = "mt-napi"
description = "napi-rs біндинг mt-core для Node/Bun-споживачів (без spawn-виклику CLI)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
mt-core = { path = "../mt-core" }
napi = { version = "2", default-features = false, features = ["napi4", "async"] }
napi-derive = "2"
serde_json.workspace = true

[build-dependencies]
napi-build = "2"
