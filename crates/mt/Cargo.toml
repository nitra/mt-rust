[package]
name = "mt"
description = "mt CLI — задачний граф @7n/mt: тонкий шар над mt-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "mt"
path = "src/main.rs"

[dependencies]
mt-core = { path = "../mt-core" }
mt-mandates = { path = "../mt-mandates" }
clap = { workspace = true, features = ["derive", "env"] }
clap_complete.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono = { workspace = true, features = ["serde"] }
agent-core = { path = "../agent-core" }
agent-protocol = { path = "../agent-protocol" }
agent-server = { path = "../agent-server" }
futures.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "rt-multi-thread", "signal"] }
tokio-tungstenite.workspace = true
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
mt-core = { path = "../mt-core", features = ["test-support"] }
tempfile.workspace = true
