[advisories]
unmaintained = "workspace"
yanked = "warn"
ignore = []

[bans]
multiple-versions = "allow"
wildcards = "deny"
highlight = "all"
skip = []

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]
exceptions = [
  # uluru — транзитивна залежність gix-odb; MPL-2.0 (file-level copyleft) точково, не глобально
  { allow = ["MPL-2.0"], crate = "uluru" },
]
confidence-threshold = 0.8

[sources]
unknown-registry = "deny"
unknown-git = "deny"
